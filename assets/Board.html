<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mail Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --col:#eceef2; --text:#1b1f24; --muted:#667085; --line:#e2e5ea;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --p1:#e5484d; --p2:#8b5cf6; --p3:#2f7cf6; --p4:#64748b; --p5:#a0aab8;
  --s-MY_REPLY:#e5484d; --s-WATCH:#0891b2; --s-STALE:#ea580c; --s-CLIENT_STALE:#a21caf; --s-LATER:#64748b; --s-REMINDED:#d97706; --s-WAITING_CM:#f59e0b; --s-ACTION:#db2777; --s-IN_PROGRESS:#2f7cf6; --s-WAITING_CLIENT:#7c3aed; --s-JIRA:#0052cc; --s-JIRA_WIP:#3b82f6; --s-JIRA_DONE:#16a34a;
  --s-COMPLETED:#16a34a; --s-FYI:#94a3b8; --s-INTERNAL:#0ea5a4; --s-AUTO:#b8a1e8; --s-DONE:#9ca3af;
  --chip:#eef0f4; --chip-on:#1b1f24; --chip-on-text:#fff; --accent:#1b1f24; --sel:#2f7cf6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --panel:#1a1d23; --col:#14171c; --text:#e8eaed; --muted:#9aa3af; --line:#2a2f37;
    --shadow:0 1px 2px rgba(0,0,0,.4); --chip:#232830; --chip-on:#e8eaed; --chip-on-text:#111; --accent:#e8eaed; --sel:#5b9bff;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
#imgZoom{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;gap:10px;padding:20px}#imgZoom.show{display:flex}#imgZoom figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:88vw}#imgZoom img{max-width:88vw;max-height:84vh;border-radius:8px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}#imgZoom figcaption{color:#e5e7eb;font-size:12.5px}#imgZoom button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:40px;height:40px;font-size:24px;line-height:40px;cursor:pointer;flex:none}#imgZoom button:hover{background:rgba(255,255,255,.28)}#imgZoom .iz-x{position:absolute;top:14px;right:16px}
.qwrap{position:relative;display:inline-flex;align-items:center}.qwrap .search{padding-right:28px;width:100%}.qclear{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:none;border:0;background:var(--line);color:var(--text);width:20px;height:20px;border-radius:50%;font-size:14px;line-height:20px;padding:0;cursor:pointer}.qclear:hover{background:var(--muted);color:var(--bg)}.qwrap.has .qclear{display:block}
.search{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;min-width:220px;font:inherit}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.warn{background:#ea580c;border-color:#ea580c;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.fgroup{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bf-pop{position:fixed;z-index:60;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:260px;max-width:calc(100vw - 24px);padding:8px;display:none}
.bf-pop.show{display:block}.bf-pop input[type=search]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit;font-size:13px;margin-bottom:6px}
.bf-list{max-height:300px;overflow:auto;display:flex;flex-direction:column}.bf-list label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}.bf-list label:hover{background:var(--chip)}
.bf-list .n{margin-left:auto;color:var(--muted);font-size:11.5px}.bf-foot{display:flex;justify-content:space-between;margin-top:6px;font-size:12px}.bf-foot button{border:0;background:none;color:#2563eb;cursor:pointer;font:inherit;padding:2px 4px}
.flabel{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.chip{border:0;background:var(--chip);color:var(--text);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--chip-on);color:var(--chip-on-text)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.board{flex:1;min-height:0;display:flex;gap:12px;padding:14px 16px 16px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;align-items:flex-start}
.col{background:var(--col);border-radius:12px;min-width:290px;width:290px;flex:none;display:flex;flex-direction:column;max-height:100%}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;font-weight:600;border-top:3px solid var(--c);border-radius:12px 12px 0 0}
.col-h .n{margin-left:auto;background:var(--panel);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
.col-h input{margin:0;cursor:pointer}
.col-h{cursor:grab}
.col.timeline .col-h{cursor:default}
/* İlk yükleme iskeleti */
.skel .col-h,.skel .col-sub{cursor:default}
.sk{position:relative;overflow:hidden;background:color-mix(in srgb,var(--muted) 16%,transparent);border-radius:6px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--panel) 65%,transparent),transparent);animation:skshine 1.3s infinite}
@keyframes skshine{to{transform:translateX(100%)}}
.skcard{background:var(--panel);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;border-left:3px solid color-mix(in srgb,var(--muted) 25%,transparent)}
.skerr{margin:40px auto;text-align:center;color:var(--muted);max-width:420px}
@media (prefers-reduced-motion: reduce){.sk::after{animation:none}}
.col.timeline .card{cursor:pointer}
.tl-st{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:2px 0 3px}
.tl-st .dot{width:7px;height:7px;border-radius:50%}

.col-h .grip{color:var(--muted);opacity:.45;font-size:12px;letter-spacing:-2px;margin-left:-4px}
.col-h:hover .grip{opacity:1}
.col.col-dragging{opacity:.45}
.col.drop-before{box-shadow:-4px 0 0 0 var(--sel)}
.col.drop-after{box-shadow:4px 0 0 0 var(--sel)}
.col-sub{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;padding:0 12px 8px;min-height:22px}
.newbtn{margin-left:auto;border:0;background:var(--sel);color:#fff;border-radius:999px;font:inherit;font-size:11px;font-weight:600;padding:2px 8px;cursor:pointer;display:none}
.newbtn.show{display:inline-block}
.list{position:relative;padding:0 8px 10px;overflow-y:auto;min-height:60px;flex:1;display:flex;flex-direction:column;gap:8px;border-radius:0 0 12px 12px;transition:background .15s;overflow-anchor:none;overflow-x:hidden;overscroll-behavior-x:auto;overscroll-behavior-y:contain}
.list.over{background:rgba(47,124,246,.10)}
.card{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:10px 11px 9px;cursor:grab;border-left:4px solid var(--pc);position:relative;flex:none}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card.closed{opacity:.72}
.card.overdue{box-shadow:0 0 0 2px var(--p1),var(--shadow)}
.card.selected{box-shadow:0 0 0 2px var(--sel),var(--shadow);background:color-mix(in srgb,var(--sel) 6%,var(--panel))}
.card .ck{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);background:var(--panel);display:none;place-items:center;cursor:pointer;color:#fff;font-size:12px;line-height:1}
.card:hover .ck, body.selecting .card .ck, .card.selected .ck{display:grid}
.card.selected .ck{background:var(--sel);border-color:var(--sel)}
.card .qdone{position:absolute;top:6px;right:32px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:11.5px;font-weight:600;display:none;align-items:center;gap:3px;cursor:pointer;box-shadow:var(--shadow);z-index:2}
.card .qdone:hover{border-color:#16a34a;color:#16a34a}
.card:hover .qdone{display:inline-flex}
.card .qai{position:absolute;top:6px;right:100px;height:22px;width:26px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}
.card:hover .qai{display:inline-flex}.card .qai:hover{border-color:var(--sel)}
body.selecting .card .qai{display:none}
@media (hover:none){ .card .qai{display:none!important} }
.jt{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:8px}.jt.off{opacity:.55}.jt-h{font-weight:700;font-size:12.5px;margin-bottom:6px}.jt-r{font-weight:400;color:var(--muted)}
.jx{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}.jx-tabs{display:flex;gap:4px;margin-bottom:6px}.jx-tabs button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:7px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}.jx-tabs button.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.jx-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.jx-row input,.jx-row select{flex:1;min-width:120px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:5px 8px;font:inherit;font-size:12.5px}.jx-res{font-size:12px;margin-top:5px;color:var(--muted)}.jx-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}.jx-ok{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.35);font-size:12.5px}.jx-ok .jx-row{margin-top:6px}.jcm{border-color:rgba(37,99,235,.35)}.jx-att{margin:2px 0 6px}.att-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}.att-h a{font-size:12px}.att-g{margin:4px 0 6px}.att-gh{font-size:11.5px;color:var(--muted);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.att-gl{display:flex;flex-wrap:wrap;gap:5px}.achip.old{opacity:.6}.ath{width:34px;height:34px;border-radius:5px;background:var(--line) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:zoom-in}.achip .atn{max-width:190px}#attZoom{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;cursor:zoom-out}#attZoom img{max-width:92vw;max-height:90vh;border-radius:8px;background:#fff}.jx-att:empty{display:none}.achip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;max-width:260px}.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.achip:has(input:checked){border-color:#2563eb;background:rgba(37,99,235,.08)}
.rmode{display:flex;gap:4px;margin:0 0 8px}.rmode button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:7px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}.rmode button.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.pchip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}.pchip:hover{border-color:var(--text)}.jc-info b{font-weight:700}.jx-res a{font-weight:700}
.jc{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:8px;font-size:12.5px}.jc .jx-row{margin-top:6px}
.jr{display:flex;gap:6px;margin:0 0 6px}.jr input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;font-weight:600}
body.viewer>*:not(#viewer){display:none!important}#viewer{max-width:860px;margin:0 auto;padding:14px 16px 40px}.vw-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}.vw-top h2{flex:1;margin:0;font-size:17px}
.rc{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px;align-items:center}
.rc .rcp{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;border-radius:999px;padding:3px 9px;cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .rcp b{font-weight:700;font-size:10.5px;margin-right:2px}.rc .rcp i{font-style:normal;font-size:10px;opacity:.7}
.rc .rcp.to{border-color:var(--sel);color:var(--text);background:color-mix(in srgb,var(--sel) 12%,transparent)}.rc .rcp.to b{color:var(--sel)}
.rc .rcp.cc{border-color:color-mix(in srgb,var(--sel) 45%,transparent);color:var(--text)}
.rc input{border:1px dashed var(--line);background:transparent;color:var(--text);border-radius:999px;padding:3px 9px;font:inherit;font-size:12px;width:150px}
.ai-row{display:flex;gap:6px;margin:4px 0 8px}.ai-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:6px 9px;font:inherit;font-size:12.5px}
.ai-busy textarea{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--sel) 10%,transparent),transparent) 0 0/200% 100%;animation:aiShine 1.2s linear infinite}
@keyframes aiShine{to{background-position:-200% 0}}
body.selecting .card .qdone{display:none}
@media (hover:none){ .card .qdone{display:inline-flex} }
.row1{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap;padding-right:22px}
.pill{font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 6px;background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--pc)}
.pill.new{--pc:var(--sel)}
.card.unseen .title{font-weight:750}
.card.unseen .title::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sel);margin-right:6px;vertical-align:1px}
.pill.stale{--pc:#ea580c}
.brand{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.title{font-weight:600;font-size:13.5px;line-height:1.3;margin-bottom:4px}
.sum{color:var(--muted);line-height:1.45;font-size:12.5px;white-space:pre-line;overflow-wrap:anywhere}
.foot{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;flex:none}
.foot .age{margin-left:auto}
.foot .age.late{color:var(--p1);font-weight:600}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:14px 0}
/* selection bar */
.selbar{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);background:var(--accent);color:var(--bg);border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:15;transition:transform .18s;max-width:calc(100vw - 32px)}
.selbar.show{transform:translate(-50%,0)}
.selbar b{font-weight:600;margin-right:4px}
.selbar select{background:var(--bg);color:var(--text);border:0;max-width:150px}
body.selecting .toast{bottom:84px}
.selbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.selbar .btn.done{background:var(--bg);color:var(--text);border-color:var(--bg);font-weight:600}
.selbar .btn.warn{background:#ea580c;border-color:#ea580c;color:#fff}
.dragghost{position:fixed;top:-100px;left:-100px;background:var(--sel);color:#fff;font-weight:600;padding:6px 10px;border-radius:8px;font-size:12px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:10}
.ov.show{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:820px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:20px 22px 22px}
.m-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rx{flex-basis:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}.rx .pchip{cursor:pointer}.rx input{width:170px;padding:3px 7px;font-size:12px}
.rloop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.rloop select{flex:1;min-width:0;max-width:100%}.rloop .meta:last-child{flex-basis:100%}
.mdone-top{display:none}
.jst{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 10px}.jst select{max-width:260px}.jst select:disabled{opacity:.7}
/* Jira kartından maile cevap: seçilen marka maili pencerenin yanında */
.peek{display:none;background:var(--panel);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:16px 18px 18px;width:520px;flex:0 1 520px;min-width:0;margin-left:14px;position:sticky;top:0;align-self:flex-start;max-height:calc(100vh - 80px);overflow-y:auto}
.ov.peeking .peek{display:block}
.ov.peeking .modal{flex:1 1 640px;min-width:0}
.peek-h{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.peek-h h3{margin:0;font-size:15px;line-height:1.35;flex:1;min-width:0}
.peek .msgs{margin-top:6px}
@media (max-width:1100px){ .ov.peeking{flex-direction:column;align-items:center} .peek{width:100%;max-width:820px;flex:none;margin:12px 0 0;position:static;max-height:none} .ov.peeking .modal{flex:none;width:100%} }
/* Mobil: kart penceresi tam ekran, üst şerit (gezinme, Done, kapat) kaydırırken sabit kalır */
@media (max-width:640px){
  .ov{padding:0}
  .modal{border-radius:0;min-height:100%;padding:0 14px 24px;box-shadow:none}
  .m-top{position:sticky;top:0;z-index:5;background:var(--panel);margin:0 -14px 10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:nowrap}
  .m-top .brand{display:none}
  .m-top .pill{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:24vw;flex:none}
  .m-top .nav{margin-left:auto;min-width:0}
  .m-top .navpos{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
  .mdone-top{display:inline-flex;align-items:center;gap:4px;font-weight:600}
}
.modal h2{margin:0 0 4px;font-size:18px;line-height:1.3}
.m-subj{color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.box{background:var(--bg);border-radius:10px;padding:10px 12px}
.box.full{grid-column:1/-1}
.box.remind{background:color-mix(in srgb,#ea580c 10%,var(--bg))}
.box h4{margin:0 0 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.box p{margin:0;line-height:1.45}
.quote{font-family:ui-monospace,Menlo,monospace;background:var(--panel);border-radius:6px;padding:6px 8px;margin:6px 0;display:inline-block}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
.ctrls label{font-size:11px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:3px}
select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

.apc.done{opacity:.75}

.pl-sec{margin:0 0 14px}.pl-sec h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pl-list{display:flex;flex-direction:column;gap:8px}

.ap-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px}

/* ---------- Analiz: grafik rolleri (açık/koyu ayrı seçilmiş adımlar) ---------- */
.an{

  --series-5:#e87ba4; --series-6:#008300; --series-7:#4a3aa7; --series-8:#e34948;
  --series-none:#98a2b3; --grid:#eceef2; --axis:#d0d5dd;
}
@media (prefers-color-scheme: dark){
  .an{
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
    --series-none:#7b8494; --grid:#242931; --axis:#39404a;
  }
}
.an-ctrl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:12px}
.an-ctrl .fgroup input[type=date]{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:4px 7px;font:inherit;font-size:12px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--chip);border-radius:8px;padding:2px;gap:2px;max-width:100%}
.seg button{white-space:nowrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.an-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{color:var(--muted);font-size:11.5px;font-weight:600}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{color:var(--muted);font-size:11.5px;margin-top:2px}
.an-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:12px}
@media (max-width:980px){.an-grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;min-width:0}
.panel h3{margin:0;font-size:13.5px;font-weight:700}

.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:6px}

.legend button.off{color:var(--muted);opacity:.55}
.legend button.off .sw{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}
.chart .lbl{fill:var(--text);font-weight:600}
.tt{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(16,24,40,.14);border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;z-index:5;display:none}

.an-table{margin-top:12px}

.td-due.late{color:#dc2626;font-weight:600}

.td-mail:hover{text-decoration:underline}
.td-unlink{margin-left:5px;color:var(--muted);font-weight:700}

.td-edit,.td-pick{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}

.td-pick input{flex:1 1 100%}
.td-res{flex:1 1 100%;display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}

function api(fn){
  var args = Array.prototype.slice.call(arguments,1);

// ---------- Yazı kutuları içerik doldukça uzasın (cevap, Jira yorumu, task açıklaması…) ----------
// AI metni kodla yazdığında 'input' olayı olmaz → value ayarlayıcısı da kutuyu büyütür; gizliyken yazılan kutu görünür olunca (ResizeObserver) büyür.
function taGrow(t){
  if (!t || !t.isConnected || t.dataset.nogrow || !t.offsetParent) return;
  if (!t._h0) t._h0 = t.offsetHeight;                     // ilk görünen yükseklik = alt sınır
  var max = Math.round(window.innerHeight * 0.75);
  t.style.height = 'auto';
  var h = Math.max(t._h0, t.scrollHeight + 2);
  t.style.height = Math.min(h, max) + 'px';
  t.style.overflowY = h > max ? 'auto' : 'hidden';
}
var TA_RO = (typeof ResizeObserver !== 'undefined') ? new ResizeObserver(function(es){ es.forEach(function(e){ var t=e.target; if (t.offsetParent && t._gv !== t.value.length + '|' + t.clientWidth){ t._gv = t.value.length + '|' + t.clientWidth; taGrow(t); } }); }) : null;
function taWatch(t){ if (!t._watched && TA_RO){ t._watched = true; TA_RO.observe(t); } }
(function(){
  var d = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value'); if (!d || !d.set) return;

    get:function(){ return d.get.call(this); },

})();
document.addEventListener('input', function(e){ var t=e.target; if (t && t.tagName==='TEXTAREA'){ taWatch(t); taGrow(t); } });
document.addEventListener('focusin', function(e){ var t=e.target; if (t && t.tagName==='TEXTAREA'){ taWatch(t); taGrow(t); } });
window.addEventListener('resize', function(){ document.querySelectorAll('textarea').forEach(function(t){ if (t.style.height) taGrow(t); }); });
function toast(t,ms){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){el.style.display='none'},ms||2800);}
// ---------- PANO OKUNMA DURUMU ----------
// '' = görüldü · 'new' = hiç açılmadı · 'upd' = açıldıktan sonra yeni mesaj geldi (kendi mesajın sayılmaz)
function unseenKind(c){

}
function markSeenCard(c, msgId){

  S.seen[c.id]=mid; S.seenQ[c.id]=mid;

  });

    var q=S.seenQ, pairs=Object.keys(q).map(function(k){return [k,q[k]]});
    api('markSeen', pairs).then(function(){ pairs.forEach(function(p){ if (S.seenQ[p[0]]===p[1]) delete S.seenQ[p[0]]; }); }).catch(function(){});

function copyText(t){
  var ok=false;
  try { var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); ok=document.execCommand('copy'); ta.remove(); } catch(e){}
  if (!ok && navigator.clipboard) { try { navigator.clipboard.writeText(t); ok=true; } catch(e){} }
  return ok;
}
// Masaüstü: Gmail'in "pop out" penceresi (tek konuşma, küçük pencere) — tam Gmail sekmesi yerine
function gmailPopoutUrl(tid){

  var me = (S.data && S.data.me) || '';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var CM_WAIT = ['WAITING_CM','STALE','REMINDED'];
function sinceInfo(c){

  var m=Math.max(0,Math.floor(ms/60000)), h=Math.floor(m/60), d=Math.floor(h/24);

function age(iso){

// Bekleme iş günü: geldiği gün 1. gün (18:00 sonrası geldiyse ertesi gün başlar), bugün dahil, hafta sonu hariç — sunucudaki kuralla aynı
function waitDays(iso){ if(!iso) return 0; var c=new Date(iso); if(isNaN(c)) return 0; if(c.getHours()>=18) c=new Date(c.getTime()+864e5);
  c=new Date(c.getFullYear(),c.getMonth(),c.getDate()); while(c.getDay()===0||c.getDay()===6) c.setDate(c.getDate()+1); c.setDate(c.getDate()+1);   // geldiği gün sayılmaz
  var t=new Date(), end=new Date(t.getFullYear(),t.getMonth(),t.getDate()-(t.getHours()<9?1:0)), n=0;   // bugün 09:00'dan sonra sayılır
  while(c<=end){ var w=c.getDay(); if(w>=1&&w<=5) n++; c.setDate(c.getDate()+1); } return n; }

function isJiraCard(c){ return /(^|,)JIRA(,|$)/.test(String(c.flags||'')) || /^JIRA/.test(String(c.status||'')); }
function visible(c){
  if (S.noJira && c.id!==S.openId && isJiraCard(c)) return false;
  if (S.unseenOnly && !isUnseen(c) && c.id!==S.openId) return false;     // açık kart gezinirken kaybolmasın
  if (S.mine && !c.recentMine) return false;
  if (S.cms.size && !S.cms.has(filterKey(c))) return false;
  if (S.prios.size && !S.prios.has(c.priority)) return false;
  if (S.brands.size && S.data.filterBy!=='MARKA' && !S.brands.has(brandKey(c.brand))) return false;
  if (!S.showClosed && c.closed) return false;
  if (S.q){
    var hay=(c.title+' '+c.subject+' '+c.brand+' '+c.cm+' '+c.summary+' '+c.participants).toLowerCase();
    if (hay.indexOf(S.q)<0) return false;
  }
  return true;
}
function sortCards(st, arr){
  return arr.sort(function(a,b){
    if (a.priority!==b.priority) return a.priority-b.priority;
    var da=new Date(a.lastDate).getTime(), db=new Date(b.lastDate).getTime();
    return (st==='MY_REPLY'||st==='STALE') ? da-db : db-da;
  });
}
// "En Güncel" sütunu: açık işler, son mesaj tarihine göre yeniden eskiye (salt görüntü, taşıma yok)
var TIMELINE_SKIP=['AUTO','INTERNAL','DONE'];
function timelineCards(){
  return S.data.cards.filter(function(c){ return !c.closed && TIMELINE_SKIP.indexOf(c.status)<0 && visible(c); })
    .sort(function(a,b){ return new Date(b.lastDate).getTime()-new Date(a.lastDate).getTime(); });
}
function visibleCardsIn(st){ return sortCards(st, S.data.cards.filter(function(c){return c.status===st && visible(c)})); }

// ---------- RENDER ----------
function captureScroll(){
  var board=document.getElementById('board'), snap={left:board.scrollLeft, win:window.scrollY, lists:{}};
  board.querySelectorAll('.list').forEach(function(list){
    var anchor=null;
    list.querySelectorAll('.card').forEach(function(card){
      if (!anchor && card.offsetTop + card.offsetHeight > list.scrollTop) anchor=card;
    });
    snap.lists[list.dataset.status]={top:list.scrollTop, anchor:anchor?anchor.dataset.id:null, off:anchor?anchor.offsetTop-list.scrollTop:0};
  });
  return snap;
}
function restoreScroll(snap){
  var board=document.getElementById('board');
  board.scrollLeft=snap.left;
  board.querySelectorAll('.list').forEach(function(list){
    var s=snap.lists[list.dataset.status]; if(!s) return;
    var card = s.anchor ? list.querySelector('.card[data-id="'+s.anchor+'"]') : null;
    list.scrollTop = card ? card.offsetTop - s.off : s.top;
    updateNewBadge(list);
  });
  window.scrollTo(0, snap.win);
}
function updateNewBadge(list){
  var btn=list.parentNode.querySelector('.newbtn'); if(!btn) return;
  var n=0;
  list.querySelectorAll('.card.is-new').forEach(function(c){ if(c.offsetTop + c.offsetHeight <= list.scrollTop + 4) n++; });
  btn.textContent='↑ '+n+' yeni'; btn.classList.toggle('show', n>0);
}
// Sütun sırası: sanal sütunlar (En Güncel, Yapılacaklar) + durum sütunları; hepsi sürüklenerek sıralanabilir
var VIRTUAL_COLS=['TIMELINE','TODO'];
function orderedColIds(){
  var ids=VIRTUAL_COLS.concat(S.data.statuses.map(function(s){return s.id}));
  var order=(S.data.columnOrder||[]).filter(function(id){return ids.indexOf(id)>=0});
  ids.forEach(function(id,i){
    if (order.indexOf(id)>=0) return;
    var prev=null; for (var k=i-1;k>=0;k--){ if(order.indexOf(ids[k])>=0){ prev=ids[k]; break; } }
    order.splice(prev? order.indexOf(prev)+1 : 0, 0, id);
  });
  return order;
}
function orderedStatuses(){
  return orderedColIds().filter(function(id){ return VIRTUAL_COLS.indexOf(id)<0; })
    .map(function(id){ return S.data.statuses.find(function(s){return s.id===id}); });
}
function saveOrder(order){
  S.data.columnOrder=order; render();
  api('saveColumnOrder', order).catch(function(e){ toast('Sıra kaydedilemedi: '+(e.message||e)); });
}
function colDnD(col, id){
  var hdr=col.querySelector('.col-h');
  hdr.setAttribute('draggable','true');
  hdr.addEventListener('dragstart',function(e){ if(e.target!==hdr) return; S.dragCol=id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/x-col',id); setTimeout(function(){col.classList.add('col-dragging')},0); });
  hdr.addEventListener('dragend',function(){ S.dragCol=null; document.querySelectorAll('.col').forEach(function(c){c.classList.remove('col-dragging','drop-before','drop-after')}); });
  col.addEventListener('dragover',function(e){
    if(!S.dragCol || S.dragCol===id) return; e.preventDefault();
    var r=col.getBoundingClientRect(), after=e.clientX > r.left + r.width/2;
    col.classList.toggle('drop-after',after); col.classList.toggle('drop-before',!after);
  });
  col.addEventListener('dragleave',function(e){ if(!col.contains(e.relatedTarget)) col.classList.remove('drop-before','drop-after'); });
  col.addEventListener('drop',function(e){
    if(!S.dragCol) return; e.preventDefault();
    var from=S.dragCol; S.dragCol=null;
    var after=col.classList.contains('drop-after');
    var order=orderedColIds().filter(function(x){return x!==from});
    var idx=order.indexOf(id); order.splice(after?idx+1:idx,0,from);
    saveOrder(order); toast('Sütun sırası kaydedildi');
  });
}

function render(){
  var board=document.getElementById('board'); board.removeAttribute('aria-busy');
  var snap = S.loaded ? captureScroll() : null;
  board.innerHTML='';
  orderedColIds().forEach(function(id){
    if (S.noJira && /^JIRA/.test(id)) return;   // Jira gizliyken Jira sütunları da görünmesin

// ---------- YAPILACAKLAR (kişisel hatırlatıcı listesi; mail kartlarından bağımsız, istenirse bir maile bağlanır) ----------
var TD = { showDone:false, pending:{}, deleted:{}, openEdit:null, openPick:null };
function todoList(){ return (S.data && S.data.todos) || (S.data.todos=[]); }
function newTodoId(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todoSave(t){
  t.updatedAt=new Date().toISOString(); TD.pending[t.id]=Date.now();
  api('saveTodo', t).catch(function(e){ toast('Hatırlatıcı kaydedilemedi: '+(e.message||e)); });
}
function todoAdd(title, threadId, threadTitle){
  title=String(title||'').trim(); if(!title) return null;
  var t={ id:newTodoId(), title:title, due:'', dueTime:'', done:false, doneAt:'', threadId:threadId||'', threadTitle:threadTitle||'', createdAt:new Date().toISOString() };
  todoList().push(t); todoSave(t); return t;
}
function todoDelete(t){
  S.data.todos=todoList().filter(function(x){ return x.id!==t.id; }); TD.deleted[t.id]=Date.now();
  api('deleteTodo', t.id).catch(function(e){ toast('Silinemedi: '+(e.message||e)); });
}
// Otomatik yenilemede sunucudan gelen liste, az önce yerelde değişenleri ezmesin
function mergeTodos(serverTodos, local){
  var now=Date.now(), map={}, out=[];
  (serverTodos||[]).forEach(function(t){ if (!(TD.deleted[t.id] && now-TD.deleted[t.id]<20000)) map[t.id]=t; });
  (local||[]).forEach(function(t){ if (TD.pending[t.id] && now-TD.pending[t.id]<20000) map[t.id]=t; });
  for (var k in map) out.push(map[k]);
  return out;
}
function dueInfo(t){
  if (!t.due) return null;
  var d=parseYmd(t.due), today=d0(new Date()), diff=Math.round((d-today)/864e5);
  var txt = diff===0?'Bugün':diff===1?'Yarın':diff===-1?'Dün':(d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==today.getFullYear()?' '+d.getFullYear():''));
  if (t.dueTime) txt+=' '+t.dueTime;
  var late = !t.done && (diff<0 || (diff===0 && t.dueTime && t.dueTime < (('0'+new Date().getHours()).slice(-2)+':'+('0'+new Date().getMinutes()).slice(-2))));
  return { txt:txt, cls: late?'late':(diff===0?'today':'') };
}
function sortTodos(a,b){
  if (!!a.due !== !!b.due) return a.due ? -1 : 1;
  if (a.due && b.due && a.due!==b.due) return a.due<b.due?-1:1;
  if ((a.dueTime||'')!==(b.dueTime||'')) return (a.dueTime||'99')<(b.dueTime||'99')?-1:1;
  return (a.createdAt||'')<(b.createdAt||'')?-1:1;
}
function renderTodoCol(board){
  var all=todoList(), open=all.filter(function(t){return !t.done}).sort(sortTodos);
  var done=all.filter(function(t){return t.done}).sort(function(a,b){ return (b.doneAt||'')<(a.doneAt||'')?-1:1; }).slice(0,30);
  var col=document.createElement('section'); col.className='col todo'; col.style.setProperty('--c','#f59e0b'); col.dataset.col='TODO';
  col.innerHTML='<div class="col-h" title="Sürükleyerek sütunun yerini değiştir"><span class="grip">⋮⋮</span><span class="dot" style="background:#f59e0b"></span>✓ Yapılacaklar<span class="n">'+open.length+'</span></div>'+
    '<div class="col-sub"><span>Kendi listen · kart sürükle ya da ✉ ile bağla</span></div>';
  colDnD(col,'TODO');
  var list=document.createElement('div'); list.className='list td-list'; list.dataset.status='TODO';
  // Bir mail kartını buraya bırakınca o maile bağlı hatırlatıcı oluşur
  list.addEventListener('dragover',function(e){ if(S.dragCol || !S.dragIds) return; e.preventDefault(); list.classList.add('over'); });
  list.addEventListener('dragleave',function(e){ if(!list.contains(e.relatedTarget)) list.classList.remove('over'); });

  open.forEach(function(t){ list.appendChild(todoEl(t)); });
  if (done.length){
    var dh=document.createElement('button'); dh.className='td-donehdr'; dh.textContent=(TD.showDone?'▾ ':'▸ ')+'Tamamlananlar ('+done.length+')';
    dh.onclick=function(){ TD.showDone=!TD.showDone; render(); };
    list.appendChild(dh);
    if (TD.showDone) done.forEach(function(t){ list.appendChild(todoEl(t)); });
  }
  col.appendChild(list); board.appendChild(col);
  if (S.todoRefocus){ S.todoRefocus=false; setTimeout(function(){ var i=document.querySelector('.td-add input'); if(i) i.focus(); },0); }

function todoEl(t){
  var el=document.createElement('div'); el.className='td'+(t.done?' done':''); el.dataset.id=t.id;

  el.innerHTML='<button class="td-ck" title="'+(t.done?'Geri al':'Tamamla')+'" aria-label="Tamamla">'+(t.done?'✓':'')+'</button>'+
    '<div class="td-main"><div class="td-title" contenteditable="'+(t.done?'false':'true')+'" spellcheck="false">'+esc(t.title)+'</div>'+

  // Tamamla / geri al

    t.done=!t.done; t.doneAt=t.done?new Date().toISOString():''; todoSave(t);
    if (t.done){ el.classList.add('done','td-leaving'); el.querySelector('.td-ck').textContent='✓'; setTimeout(render, 450); } else render();
  };
  // Başlığı yerinde düzenle
  var ti=el.querySelector('.td-title');
  ti.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); ti.blur(); } if(e.key==='Escape'){ ti.textContent=t.title; ti.blur(); } });
  ti.addEventListener('blur',function(){ var v=ti.textContent.replace(/\s+/g,' ').trim(); if(!v){ ti.textContent=t.title; return; } if(v!==t.title){ t.title=v; todoSave(t); } });
  // Bağlı mail
  var ml=el.querySelector('.td-mail');
  if (ml){
    ml.onclick=function(e){
      if (e.target.classList.contains('td-unlink')){ t.threadId=''; t.threadTitle=''; todoSave(t); render(); return; }

      else window.open('https://mail.google.com/mail/?authuser='+encodeURIComponent(S.data.me||'')+'#all/'+t.threadId,'_blank');
    };
  }
  el.querySelector('.td-a-del').onclick=function(){ todoDelete(t); render(); toast('Hatırlatıcı silindi'); };
  el.querySelector('.td-a-date').onclick=function(){ TD.openEdit = TD.openEdit===t.id ? null : t.id; TD.openPick=null; render(); };
  el.querySelector('.td-a-mail').onclick=function(){ TD.openPick = TD.openPick===t.id ? null : t.id; TD.openEdit=null; render(); };
  // Tarih düzenleyici
  if (TD.openEdit===t.id){

      res.innerHTML=list.map(function(c){ return '<button data-id="'+esc(c.id)+'"><b>'+esc(c.title||c.subject)+'</b><span>'+esc([c.brand,c.cm].filter(Boolean).join(' · '))+'</span></button>'; }).join('') || '<div class="sub" style="padding:6px">Sonuç yok</div>';

function cardEl(c, colCards, timeline){

    '<span class="age'+(late?' late':'')+(CM_WAIT.indexOf(c.status)>=0&&sinceInfo(c).cls?' '+sinceInfo(c).cls:'')+'" title="Son mesaj: '+esc(fmtDate(c.lastDate))+'">'+(late?'⏰ ':'')+esc(a.t)+(wbd?' · '+wbd+' iş g.':'')+'</span></div>';
  // Shift + tık (kart ya da kutucuk): son seçilen karttan buna kadar aynı sütundaki tüm kartları seç

    if (!S.lastClick) return false;
    var ids=colCards.map(function(x){return x.id}), i=ids.indexOf(S.lastClick), j=ids.indexOf(c.id);

    ids.slice(Math.min(i,j), Math.max(i,j)+1).forEach(function(id){ S.sel.add(id); });
    S.lastClick=c.id; render(); return true;
  };
  el.addEventListener('mousedown',function(e){ if (e.shiftKey) e.preventDefault(); });   // shift+tık metni seçmesin
  var qa=el.querySelector('.qai');
  if (qa){ qa.addEventListener('mousedown',function(e){ e.stopPropagation(); }); qa.addEventListener('click',function(e){ e.stopPropagation(); S.aiAutoFor=c.id; S.navTimeline=!!timeline; openCard(c.id); }); }
  var qd=el.querySelector('.qdone');
  if (qd){ qd.addEventListener('mousedown',function(e){ e.stopPropagation(); }); qd.addEventListener('click',function(e){ e.stopPropagation(); moveMany([c.id],'DONE'); }); }
  el.querySelector('.ck').addEventListener('click',function(e){ e.stopPropagation(); if (e.shiftKey && rangeSel()) return; toggleSel(c.id); S.lastClick=c.id; });

  el.addEventListener('dragstart',function(e){
    e.stopPropagation();
    var ids = S.sel.has(c.id) ? Array.from(S.sel) : [c.id];
    S.dragIds = ids;
    e.dataTransfer.setData('text/plain',c.id); e.dataTransfer.effectAllowed='move';
    if (ids.length>1){
      var g=document.createElement('div'); g.className='dragghost'; g.textContent=ids.length+' kart taşınıyor'; document.body.appendChild(g);
      e.dataTransfer.setDragImage(g,10,10); setTimeout(function(){g.remove()},0);
      document.querySelectorAll('.card.selected').forEach(function(x){x.classList.add('dragging')});
    }

  el.addEventListener('dragend',function(){ document.querySelectorAll('.card.dragging').forEach(function(x){x.classList.remove('dragging')}); });
  el.addEventListener('click',function(e){
    if (e.metaKey || e.ctrlKey){ toggleSel(c.id); S.lastClick=c.id; return; }
    if (e.shiftKey){ if (!rangeSel()){ toggleSel(c.id); S.lastClick=c.id; } return; }
    if (S.sel.size){ toggleSel(c.id); S.lastClick=c.id; return; }  // seçim modundayken tık = seç
    if (S.newIds.delete(c.id)) el.classList.remove('is-new');
    S.navTimeline=!!timeline;          // ← → bu sütunun sırasıyla gezsin
    openCard(c.id);
  });
  return el;
}

// ---------- ACTIONS ----------
function moveMany(ids, status){
  ids = ids.filter(function(id){ var c=cardById(id); return c && c.status!==status; });
  if (!ids.length) return;
  var prev = {};
  ids.forEach(function(id){ var c=cardById(id); prev[id]={status:c.status,closed:c.closed}; c.status=status; c.closed=(status==='COMPLETED'||status==='DONE'); });
  S.sel.clear(); render();
  // Çok kart birden taşınınca sunucuya 15'erli parçalar halinde, sırayla gönder (Gmail dakikalık kotasını aşmasın)
  var CH=15, chunks=[]; for (var i=0;i<ids.length;i+=CH) chunks.push(ids.slice(i,i+CH));
  var done=0, failed=[], closed = status==='COMPLETED'||status==='DONE';
  var next=function(k){
    if (k>=chunks.length){
      render();
      var okN=ids.length-failed.length;
      if (!failed.length) toast((ids.length>1? ids.length+' kart ':'')+(closed ? 'kapatıldı · Gmail label\'ı kaldırıldı' : 'taşındı: '+statusName(status)));
      else toast(okN+' kart taşındı · '+failed.length+' kart taşınamadı, geri alındı');
      return;
    }
    if (chunks.length>1) toast('Taşınıyor… '+done+' / '+ids.length);
    api('moveCards',chunks[k],status).then(function(res){
      var got={}; (res||[]).forEach(function(nc){ got[nc.id]=true; var c=cardById(nc.id); if(c) Object.assign(c,nc); });
      chunks[k].forEach(function(id){ if(!got[id]) failed.push(id); });
    }).catch(function(){ failed=failed.concat(chunks[k]); })
    .finally(function(){
      done+=chunks[k].length;
      failed.forEach(function(id){ var c=cardById(id); if(c && prev[id]) Object.assign(c,prev[id]); });
      next(k+1);
    });
  };
  next(0);
}
function remind(ids, mode, text){
  var cards = ids.map(cardById).filter(Boolean);
  var noCm = cards.filter(function(c){return !c.cmEmail});
  var ok = cards.filter(function(c){return c.cmEmail}).map(function(c){return c.id});
  if (!ok.length){ toast('Seçili kartlarda atanmış CM yok'); return; }
  api('remindCms', ok, mode, text||'').then(function(r){
    var good = r.results.filter(function(x){return x.ok});
    good.forEach(function(x){ var c=cardById(x.id); if(c && x.card) Object.assign(c,x.card); });
    S.sel.clear(); render();
    var msg = good.length+' hatırlatma '+(mode==='send'?'gönderildi':'taslağı oluşturuldu');
    if (noCm.length) msg += ' · '+noCm.length+' kartta CM yok';
    var bad = r.results.length-good.length; if (bad) msg += ' · '+bad+' hata';
    toast(msg);
    if (mode!=='send' && good.length===1 && !DEMO) window.open(r.draftsLink,'_blank');
  }).catch(function(e){ toast('Hata: '+(e.message||e)); });
}

// ---------- DETAIL ----------
// Kart penceresinde ← → gezinme, kartı AÇTIĞIN sütunun sırasıyla devam eder. Gezinirken bir kartın durumu değişse de
// (ör. cevap gönderince Hemen Cevapla → İş Devam Ediyor) aynı sütunda kalırsın; Done'a giden kartlar atlanır,
// sütuna sonradan düşen kartlar listenin sonuna eklenir. Pencere kapanınca sıfırlanır.
function colNav(c){
  var key=S.navTimeline ? 'TIMELINE' : null;
  if (!S.navCtx || (S.navCtx.ids.indexOf(c.id)<0)){
    key=key || c.status;
    var fresh=key==='TIMELINE' ? timelineCards() : visibleCardsIn(key);
    if (!fresh.some(function(x){return x.id===c.id;})) fresh=[c];
    S.navCtx={key:key, ids:fresh.map(function(x){return x.id;})};
  }
  var ctx=S.navCtx, now=ctx.key==='TIMELINE' ? timelineCards() : visibleCardsIn(ctx.key);
  now.forEach(function(x){ if (ctx.ids.indexOf(x.id)<0) ctx.ids.push(x.id); });
  // Listede sadece şu an bu sütunda duran kartlar + açık kart kalır. Durumunu değiştirdiğin / cevapladığın kart sütundan çıkınca
  // açıkken yerinde durur, başka karta geçince listeden düşer (sayı her zaman sütunla aynı).
  var live={}; now.forEach(function(x){ live[x.id]=1; });
  ctx.ids=ctx.ids.filter(function(id){ return live[id] || id===c.id || id===S.openId; });
  var list=ctx.ids.map(cardById).filter(function(x){ return !!x; });
  var i=list.findIndex(function(x){return x.id===c.id});
  if (i<0){ list=[c]; i=0; }
  return {list:list, i:i, key:ctx.key};
}
// ---------- MOBİL: kart açıkken sağa/sola kaydırarak önceki/sonraki kart ----------
// Kart parmağı takip eder; bırakınca hemen kayar, yeni kart içeriden kayarak gelir (konuşma yüklenirken iskelet görünür).
// Dokunmatikte mail iframe'leri dokunmayı yutmasın diye pointer-events:none; linke dokunma aşağıda elle yakalanır.
var IS_TOUCH = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
if (IS_TOUCH) document.body.classList.add('touch');
var Swipe=(function(){
  var st=null, busy=false;
  function M(){ return document.getElementById('modal'); }
  function scrollableX(el){
    for (; el && el.nodeType===1 && el.id!=='ov'; el=el.parentElement){
      var cs=getComputedStyle(el);
      if (/(auto|scroll)/.test(cs.overflowX) && el.scrollWidth>el.clientWidth+4) return true;
    }
    return false;
  }
  function setX(x, anim, op){
    var m=M(); m.style.transition = anim ? 'transform '+anim+'ms ease-out, opacity '+anim+'ms ease-out' : 'none';
    m.style.transform = x ? 'translateX('+x+')' : ''; m.style.opacity = op==null ? '' : String(op);
  }
  function start(e){
    st=null;
    if (busy || !S.openId || !e.touches || e.touches.length!==1) return;
    var el=e.target; if (el && el.nodeType!==1) el=el.parentElement;
    if (el && el.closest && el.closest('input,textarea,select,[contenteditable]')) return;
    var t=e.touches[0]; st={x:t.clientX, y:t.clientY, t:Date.now(), sc:scrollableX(el), dir:null, dx:0, target:el};
  }
  function move(e){
    if (!st) return; var t=e.touches[0], dx=t.clientX-st.x, dy=t.clientY-st.y;
    if (!st.dir){
      if (Math.abs(dx)<10 && Math.abs(dy)<10) return;
      st.dir = (!st.sc && Math.abs(dx) > Math.abs(dy)*1.3) ? 'h' : 'v';
    }
    if (st.dir!=='h') return;
    if (e.cancelable) e.preventDefault();
    st.dx=dx; setX(dx+'px', 0, Math.max(.55, 1-Math.abs(dx)/900));
  }
  function end(e){
    if (!st) return; var s=st; st=null;
    var t=e.changedTouches && e.changedTouches[0];
    if (!s.dir && t){ tapLink(s.target, t.clientX, t.clientY); return; }     // dokunma: maildeki linki aç
    if (s.dir!=='h') return;
    var dt=Math.max(1, Date.now()-s.t), dx=s.dx, fast=Math.abs(dx)/dt > .45;
    if (Math.abs(dx) < 60 && !(fast && Math.abs(dx) > 25)) { setX(0, 180); return; }   // yeterli değil → geri
    go(dx<0 ? 1 : -1);
  }
  function go(dir){
    var c=cardById(S.openId); if (!c) return setX(0,180);
    var nav=colNav(c), j=nav.i+dir;
    if (j<0 || j>=nav.list.length){ setX(0,180); var m=M(); m.classList.remove('swipe-edge'); void m.offsetWidth; m.classList.add('swipe-edge'); return; }
    busy=true;
    setX((dir>0?'-':'')+'105%', 130, .2);                                  // mevcut kart hemen dışarı
    setTimeout(function(){
      S.swipeAt=Date.now(); stepCard(dir);
      var ov=document.getElementById('ov'); if (ov) ov.scrollTop=0; M().scrollTop=0; window.scrollTo(0,0);
      setX((dir>0?'':'-')+'38%', 0, .3); void M().offsetWidth;            // yeni kart yandan
      requestAnimationFrame(function(){ setX(0, 170, 1); setTimeout(function(){ setX(0,0); busy=false; }, 190); });
    }, 125);
  }
  // Maildeki linke dokunma (iframe dokunmayı almadığı için noktadaki elemanı bulup açarız)
  function tapLink(el, x, y){
    var wrap=el && el.closest && el.closest('.msg'); if (!wrap) return;
    var fr=wrap.querySelector('iframe'); if (!fr) return;
    var r=fr.getBoundingClientRect(); if (x<r.left||x>r.right||y<r.top||y>r.bottom) return;
    try {
      var hit=fr.contentDocument.elementFromPoint(x-r.left, y-r.top), a=hit && hit.closest && hit.closest('a[href]');
      if (a && !/^\s*javascript:/i.test(a.getAttribute('href'))) window.open(a.href, '_blank');
    } catch(err){}
  }
  var ov=document.getElementById('ov');
  if (IS_TOUCH && ov){
    ov.addEventListener('touchstart', start, {passive:true});
    ov.addEventListener('touchmove', move, {passive:false});
    ov.addEventListener('touchend', end, {passive:true});
    ov.addEventListener('touchcancel', function(){ if (st && st.dir==='h') setX(0,180); st=null; }, {passive:true});
  }

})();
function stepCard(dir){
  if (!S.openId) return;
  var c=cardById(S.openId); if(!c) return;
  var nav=colNav(c), j=nav.i+dir;
  if (j<0 || j>=nav.list.length) return;
  openCard(nav.list[j].id);
  var el=document.querySelector('.card[data-id="'+nav.list[j].id+'"]'); if(el) el.scrollIntoView({block:'nearest'});
}
function openCard(id){
  var c=cardById(id); if(!c) return;
  peekHide();
  S.openId=id;
  var nk=unseenKind(c) || (S.newIds.has(c.id)?'new':'');
  S.openNew={id:c.id, kind:nk, prev:S.seen[c.id]||''};   // görüldü işaretlenmeden önceki durum (pencerede gösterilir)
  markSeenCard(c);
  if (S.newIds.delete(id)) { var ce=document.querySelector('.card[data-id="'+id+'"]'); if(ce) ce.classList.remove('is-new'); }
  var nav=colNav(c);
  var m=document.getElementById('modal');
  var stOpts=S.data.statuses.map(function(s){return '<option value="'+s.id+'"'+(s.id===c.status?' selected':'')+'>'+esc(s.name)+'</option>'}).join('');
  var pOpts=[1,2,3,4,5].map(function(p){return '<option value="'+p+'"'+(p===c.priority?' selected':'')+'>'+esc(PSHORT[p])+'</option>'}).join('');
  var cmOpts='<option value="">Atanmamış</option>'+S.data.cms.map(function(x){return '<option value="'+esc(x.email)+'"'+(x.email===c.cmEmail?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');
  var isStale = c.status==='STALE';
  m.innerHTML =
    '<div class="m-top" style="--pc:'+PCOL[c.priority]+'">'+(S.backFrom&&S.backFrom.brand===c.id?'<button class="btn sm" id="mBack" title="Geldiğin Jira kartına dön">← Jira kartı</button>':'')+'<span class="pill">'+esc(PSHORT[c.priority])+'</span>'+(c.brand?'<span class="brand">'+esc(c.brand)+'</span>':'')+
      '<span class="nav"><button class="btn sm" id="mPrev" title="Önceki (←)"'+(nav.i>0?'':' disabled')+'>‹</button><span class="navpos">'+(nav.i+1)+' / '+nav.list.length+' · '+esc(nav.key==='TIMELINE'?'En Güncel':statusName(nav.key||c.status))+'</span><button class="btn sm" id="mNext" title="Sonraki (→)"'+(nav.i<nav.list.length-1?'':' disabled')+'>›</button></span>'+
      (c.status!=='DONE'?'<button class="btn sm mdone-top" id="mDoneTop" title="Done\'a al, sıradakini aç">✓ Done</button>':'')+

// Gmail'den konuşma çekmek birkaç saniye sürer. Kart açılınca o kartın, kısa süre sonra da
// sıradaki kartın konuşması arkada yüklenir. Aynı anda en fazla 2 istek; pencere kapanınca

var Peek={ id:null };
function peekHide(){ Peek.id=null; var ov=document.getElementById('ov'), pk=document.getElementById('peek'); if(ov) ov.classList.remove('peeking'); if(pk) pk.innerHTML=''; }
function peekShow(id){
  var pk=document.getElementById('peek'), ov=document.getElementById('ov'); if(!pk||!ov) return;
  if (!id){ peekHide(); return; }

var Detail = {
  cache:{}, order:[], queue:[], running:0, MAX:2, SIZE:25, TTL:10*60*1000, timer:null,
  key:function(c){ return c.id+'|'+c.msgCount+'|'+c.lastDate; },
  get:function(c, background){
    var k=this.key(c), e=this.cache[k], self=this;
    if (e && Date.now()-e.at<this.TTL) { if(!background) self.promote(k); return e.p; }
    var entry={ at:Date.now(), started:false, bg:!!background };
    entry.p=new Promise(function(res,rej){ entry.res=res; entry.rej=rej; });
    entry.run=function(){
      entry.started=true; self.running++;
      api('getThreadDetail',c.id).then(entry.res,function(err){ delete self.cache[k]; entry.rej(err); })
        .finally(function(){ self.running--; self.pump(); });
    };
    this.cache[k]=entry; this.order.push(k); this.trim();
    if (background) this.queue.push(k); else this.queue.unshift(k);
    this.pump();
    return entry.p;
  },
  promote:function(k){ var i=this.queue.indexOf(k); if(i>0){ this.queue.splice(i,1); this.queue.unshift(k); } var e=this.cache[k]; if(e) e.bg=false; },
  pump:function(){

  },
  prefetchAround:function(c){
    clearTimeout(this.timer); var self=this;
    this.timer=setTimeout(function(){

      if (nx) self.get(nx,true).catch(function(){});
    }, 1200);
  },

    });
  },
  trim:function(){
    var self=this;

// Karanlık modda mail içeriği: satır içi (inline) renkleri koruyarak koyulaştır.
// Açık arka planlar koyu olur, koyu yazılar açılır; kırmızı/mavi gibi vurgu renkleri tonunu korur. Görsellere dokunulmaz.
function darkifyMail(doc){
  if (!doc || !doc.body) return;
  var win=doc.defaultView;
  var parse=function(c){ var m=String(c).match(/rgba?\(([^)]+)\)/); if(!m) return null; var p=m[1].split(',').map(function(x){return parseFloat(x)}); return {r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1}; };
  var hsl=function(c){ var r=c.r/255,g=c.g/255,b=c.b/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
    if(mx!==mn){ var d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return {h:h,s:s,l:l}; };
  var css=function(h,s,l){ return 'hsl('+Math.round(h)+','+Math.round(s*100)+'%,'+Math.round(l*100)+'%)'; };
  var els=doc.body.querySelectorAll('*'), n=Math.min(els.length, 4000);
  for (var i=0;i<n;i++){
    var el=els[i], tag=el.tagName;
    if (tag==='IMG'||tag==='VIDEO'||tag==='SVG'||tag==='PICTURE'||tag==='CANVAS') continue;
    var cs=win.getComputedStyle(el);
    var bg=parse(cs.backgroundColor);
    if (bg && bg.a>0.05){
      var hb=hsl(bg);
      if (hb.l>0.55){
        if (hb.s<0.18) el.style.setProperty('background-color', hb.l>0.93?'transparent':css(hb.h,hb.s,0.18+ (1-hb.l)*0.5), 'important');   // beyaz/gri zemin → koyu
        else el.style.setProperty('background-color', css(hb.h, Math.min(hb.s,0.55), 0.22), 'important');                           // renkli zemin → aynı ton, koyu
      }
    }
    var fg=parse(cs.color);
    if (fg){
      var hf=hsl(fg);
      if (hf.s<0.2){ if (hf.l<0.5) el.style.setProperty('color', css(hf.h,hf.s,0.88-hf.l*0.3), 'important'); }   // siyah/gri yazı → açık gri
      else if (hf.l<0.62) el.style.setProperty('color', css(hf.h, Math.min(1,hf.s+0.1), 0.72), 'important');     // renkli yazı → aynı ton, açık
    }
    var bc=parse(cs.borderTopColor);
    if (bc && parseFloat(cs.borderTopWidth)>0){ var hc=hsl(bc); if (hc.l>0.7) el.style.setProperty('border-color', css(hc.h,hc.s,0.3), 'important'); }
  }
}
// Mail içinde düz metin olarak yazılmış linkleri (https://…, www.…) tıklanabilir yap; mevcut <a> linklerine dokunmaz
function linkifyDoc(doc){
  if (!doc || !doc.body) return;
  var RE=/\b((?:https?:\/\/|www\.)[^\s<>"'`]+)/gi;
  var walker=doc.createTreeWalker(doc.body, 4 /* NodeFilter.SHOW_TEXT */, null), nodes=[], n;
  while ((n=walker.nextNode())){
    if (!n.nodeValue || n.nodeValue.indexOf('http')<0 && n.nodeValue.indexOf('www.')<0) continue;
    var p=n.parentNode, skip=false;
    while (p && p!==doc.body){ var t=p.nodeName; if (t==='A'||t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'){ skip=true; break; } p=p.parentNode; }
    if (!skip) nodes.push(n);
  }
  nodes.forEach(function(node){
    var txt=node.nodeValue, frag=doc.createDocumentFragment(), last=0, m; RE.lastIndex=0;
    while ((m=RE.exec(txt))){
      var url=m[1].replace(/[.,;:!?)\]}>»"']+$/,''); if (!url) continue;
      if (m.index>last) frag.appendChild(doc.createTextNode(txt.slice(last, m.index)));
      var a=doc.createElement('a'); a.href=/^www\./i.test(url) ? 'https://'+url : url; a.textContent=url; a.target='_blank'; a.rel='noopener noreferrer';
      frag.appendChild(a); last=m.index+url.length; RE.lastIndex=last;
    }
    if (!last) return;
    if (last<txt.length) frag.appendChild(doc.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
  doc.querySelectorAll('a[href]').forEach(function(a){ if(!a.target) a.target='_blank'; a.rel='noopener noreferrer'; });
}
// Görsel önizleme (lightbox): ‹ › ile gezinme, Esc / dışına tıkla ile kapanır

      if (n.nodeType===3 && !n.nodeValue.trim()) { n.remove(); continue; }
      if (n.nodeType===1 && /^(IMG|TABLE|HR|VIDEO|PICTURE|SVG|A)$/.test(n.tagName)) break;   // görsel/tablo/link kendisi içeriktir (boş metinli diye silinmez)
      if (n.nodeType===1 && (n.tagName==='BR' || (!n.textContent.trim() && !n.querySelector('img,table,hr,video,picture,svg')))) { n.remove(); continue; }
      if (n.nodeType===1 && n.lastChild) { var before=n.childNodes.length; trimEnd(n); if(n.childNodes.length!==before) continue; }
      break;
    }
  };
  trimEnd(body);
  var st=headStyles(doc); doc.querySelectorAll('style').forEach(function(s){s.remove()});
  var hasImg = !!body.querySelector('img');
  return { html: st+'<body>'+body.innerHTML+'</body>', text: (body.textContent||'').replace(/\s+/g,' ').trim() + (hasImg?' [img]':'') };
}

    var inp=rc.querySelector('.apc-add'); if (inp) inp.onkeydown=function(ev){ if(ev.key==='Enter'||ev.key===','){ ev.preventDefault(); var v=inp.value.trim().toLowerCase().replace(/[,;]$/,''); if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ d.to=d.to||[]; if(d.to.indexOf(v)<0) d.to.push(v); rc.innerHTML=apRcHtml(it); bindRc(); } else toast('Geçerli bir e-posta yaz'); } };

  // konuşma

      var keepT=S.threadMsgs, keepN=S.openNew, keepO=S.openId; S.openNew=null; S.openId=null;
      try { renderThread(mb, (r&&r.messages)||[]); } finally { S.threadMsgs=keepT; S.openNew=keepN; S.openId=keepO; }

  re.onclick=function(){
    if (it._pend||it._sending) return;

    api('regenApproval', it.id, hint.value||'').then(function(r){ it.data=r.data; it._stale=false; var nn=apNode(it); n.replaceWith(nn); })
      .catch(function(e){ toast('Yeniden yazılamadı: '+(e.message||e)); re.disabled=false; re.textContent='✨ Yeniden yaz'; ta.disabled=false; });
  };

}
function apActs(it, n){
  var a=n.querySelector('.apc-act'); if(!a) return;
  var lock=function(on){ n.querySelectorAll('textarea,input,.apc-re,.rcp').forEach(function(x){ x.disabled=on; }); };
  if (it._done){ a.innerHTML='<div class="apc-pend">✅ '+esc(it._doneMsg||'Gönderildi')+'</div>'; lock(true); return; }
  if (it._sending){ a.innerHTML='<div class="apc-pend">📤 Gönderiliyor…</div>'; lock(true); return; }
  if (it._pend){
    var left=it._pend.left;
    a.innerHTML='<div class="apc-pend"><span>⏳ <b>'+left+'</b> sn sonra '+(it.type==='JIRA_COMMENT'?'Jira\'ya yazılacak':'gönderilecek')+'</span><span class="bar"><i style="width:'+Math.round(100*left/AP.UNDO)+'%"></i></span><button class="btn sm apc-undo">↶ Geri al</button></div>';
    a.querySelector('.apc-undo').onclick=function(){ clearInterval(it._pend.timer); it._pend=null; lock(false); apActs(it, n); toast('Geri alındı'); };
    lock(true); return;
  }
  lock(false);
  if (it._stale){
    a.innerHTML='<div class="apc-pend">⚠️ '+esc(it._stale)+' <span class="spacer"></span><button class="btn sm apc-force">Yine de gönder</button><button class="btn sm apc-regen">✨ Yeni mesaja göre yeniden hazırla</button><button class="btn sm apc-skip">✕ Geç</button></div>';
    a.querySelector('.apc-force').onclick=function(){ apApprove(it, n, true); };
    a.querySelector('.apc-regen').onclick=function(){ it._stale=null; n.querySelector('.apc-re').click(); };
    a.querySelector('.apc-skip').onclick=function(){ apSkip(it, n); };
    return;
  }
  a.innerHTML='<div class="apc-a"><button class="btn primary apc-ok">✓ Onayla ve '+(it.type==='JIRA_COMMENT'?'Jira\'ya yaz':'gönder')+'</button><button class="btn apc-skip" title="Bu mesaj için öneriyi kaldır; yeni mesaj gelirse tekrar önerilir">✕ Geç</button><span class="spacer"></span><span class="meta">'+(it.type==='JIRA_COMMENT'?'@ ile etiketlenenlere Jira bildirim gönderir':((it.data.to||[]).length+(it.data.cc||[]).length)+' kişiye gidecek')+'</span></div>';
  a.querySelector('.apc-ok').onclick=function(){ apApprove(it, n, false); };
  a.querySelector('.apc-skip').onclick=function(){ apSkip(it, n); };
}
function apApprove(it, n, force){
  var d=it.data, ta=n.querySelector('.apc-tx'); d.text=ta.value;
  if (!String(d.text||'').trim()){ toast('Metin boş'); return; }
  if (it.type==='MAIL' && !(d.to||[]).length){ toast('En az bir "Kime" alıcısı seç'); return; }
  it._stale=null;
  var go=function(){
    it._pend=null; it._sending=true; apActs(it, n);
    var edits={ text:d.text, force:!!force }; if (it.type==='MAIL'){ edits.to=d.to; edits.cc=d.cc||[]; } else edits.key=d.key;
    api('approveApproval', it.id, edits).then(function(r){
      it._sending=false;
      if (r.stale){ it._stale=r.message||'Bu konuya yeni mesaj geldi.'; apActs(it, n); return; }
      it._done=true; it._doneMsg=it.type==='JIRA_COMMENT' ? (d.key+' yorumu yazıldı') : 'Gönderildi';
      if (r.card && S.data){ var k=cardById(it.threadId); if (k) Object.keys(r.card).forEach(function(f){ if (r.card[f]!==undefined) k[f]=r.card[f]; }); try{ render(); }catch(e){} }
      n.classList.add('done'); apActs(it, n); apBadge();
      setTimeout(function(){ AP.items=AP.items.filter(function(x){ return x!==it; }); n.remove(); apRender(); }, 2500);
      AP.noMore=false; apLoad(true, true);          // sıradaki öneri arkadan hazırlansın
    }).catch(function(e){ it._sending=false; apActs(it, n); toast('Gönderilemedi: '+(e.message||e)); });
  };
  it._pend={ left:AP.UNDO };
  it._pend.timer=setInterval(function(){ if(!it._pend) return; it._pend.left--; if (it._pend.left<=0){ clearInterval(it._pend.timer); go(); } else apActs(it, n); },1000);
  apActs(it, n);
}
function apSkip(it, n){
  AP.items=AP.items.filter(function(x){ return x!==it; }); n.remove(); apRender();
  api('skipApproval', it.id).then(function(){ AP.noMore=false; apLoad(true, true); }).catch(function(){});
}

// --- tarih yardımcıları (yerel saat) ---
function d0(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function ymd(d){ var p=function(n){return (n<10?'0':'')+n}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parseYmd(s){ var a=String(s).split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function pStart(d, g){ d=d0(d); if (g==='week'){ d.setDate(d.getDate()-((d.getDay()+6)%7)); } else if (g==='month'){ d.setDate(1); } return d; }
function pNext(d, g){ var n=new Date(d); if (g==='day') n.setDate(n.getDate()+1); else if (g==='week') n.setDate(n.getDate()+7); else n.setMonth(n.getMonth()+1); return n; }
function pLabel(d, g, long){
  if (g==='month') return MON[d.getMonth()]+' '+(long? d.getFullYear() : String(d.getFullYear()).slice(2));
  if (g==='week' && long){ var e=new Date(d); e.setDate(e.getDate()+6); return d.getDate()+' '+MON[d.getMonth()]+' – '+e.getDate()+' '+MON[e.getMonth()]+' haftası'; }
  return d.getDate()+' '+MON[d.getMonth()]+(long? ' '+d.getFullYear() : '');
}
function grName(g){ return g==='day'?'günlük':g==='week'?'haftalık':'aylık'; }

function anApplyPreset(p){
  AN.preset=p;
  var today=d0(new Date()), from, to=today;
  if (p==='today'){ from=today; }
  else if (p==='yesterday'){ from=new Date(today); from.setDate(from.getDate()-1); to=from; }
  else if (p==='all'){ from = AN.data && AN.data.since ? d0(new Date(AN.data.since)) : new Date(today.getFullYear()-1, today.getMonth(), today.getDate()); }
  else { from=new Date(today); from.setDate(from.getDate()-Number(p)+1); from=pStart(from, AN.gran); }   // ilk dönem yarım kalmasın
  AN.from=from; AN.to=to;
  document.getElementById('anFrom').value=ymd(from); document.getElementById('anTo').value=ymd(to);
  document.querySelectorAll('#anPreset button').forEach(function(b){ b.classList.toggle('on', b.dataset.d===p); });
  anRender();
}
document.querySelectorAll('#anPreset button').forEach(function(b){ b.onclick=function(){ anApplyPreset(b.dataset.d); }; });
['anFrom','anTo'].forEach(function(id){
  document.getElementById(id).onchange=function(){
    var f=document.getElementById('anFrom').value, t=document.getElementById('anTo').value;
    if (!f || !t) return;
    AN.from=parseYmd(f); AN.to=parseYmd(t);
    if (AN.from>AN.to){ var x=AN.from; AN.from=AN.to; AN.to=x; document.getElementById('anFrom').value=ymd(AN.from); document.getElementById('anTo').value=ymd(AN.to); }
    AN.preset=''; document.querySelectorAll('#anPreset button').forEach(function(b){ b.classList.remove('on'); });
    anRender();
  };
});
document.querySelectorAll('#anGran button').forEach(function(b){ b.onclick=function(){
  AN.gran=b.dataset.g; document.querySelectorAll('#anGran button').forEach(function(x){ x.classList.toggle('on', x===b); }); if (AN.preset) anApplyPreset(AN.preset); else anRender(); }; });
document.querySelectorAll('#anScope button').forEach(function(b){ b.onclick=function(){

// --- veri → seriler ---
// Renk varlığa bağlıdır (CM listesindeki sırası), filtreyle/sıralamayla değişmez.
function anSeriesDefs(){
  var names=(AN.data.cms||[]).slice(), seen={};
  names.forEach(function(n){ seen[n]=true; });
  (AN.data.rows||[]).forEach(function(r){ var n=r[1]||'Atanmamış'; if (!seen[n] && n!=='Atanmamış'){ seen[n]=true; names.push(n); } });
  // Atanmamış konuşmalar analize girmez; sadece bir CM'e atanmış işler sayılır
  return names.slice(0,8).map(function(n,i){ return { name:n, color:'var(--series-'+(i+1)+')' }; });
}
function anCompute(){
  var g=AN.gran, from=AN.from, toEnd=new Date(AN.to.getFullYear(), AN.to.getMonth(), AN.to.getDate()+1);
  var defs=anSeriesDefs(), idx={};
  defs.forEach(function(s,i){ idx[s.name]=i; });
  var periods=[], pIdx={};
  for (var p=pStart(from,g); p<toEnd; p=pNext(p,g)){ pIdx[+p]=periods.length; periods.push(p); }
  var counts=defs.map(function(){ return periods.map(function(){ return 0; }); });
  var total=0;
  (AN.data.rows||[]).forEach(function(r){
    var d=new Date(r[0]); if (isNaN(d) || d<from || d>=toEnd) return;
    if (AN.scope==='work' && (r[2]==='AUTO' || r[2]==='INTERNAL' || /^JIRA/.test(r[2]||''))) return;   // iş mailleri: otomatik, iç duyuru ve Jira bildirimleri hariç
    var si=idx[r[1]||'']; if (si===undefined) return;          // atanmamış → sayılmaz
    var pi=pIdx[+pStart(d,g)]; if (pi===undefined) return;
    counts[si][pi]++; total++;
  });
  var series=defs.map(function(s,i){ return { name:s.name, color:s.color, values:counts[i], total:counts[i].reduce(function(a,b){return a+b},0) }; });
  var days=Math.max(1, Math.round((toEnd - from)/864e5));
  return { periods:periods, series:series, total:total, days:days };
}

// --- çizim ---
function anRender(){
  if (!AN.data) return;
  var m=anCompute(), body=document.getElementById('anBody');
  if (!m.periods.length){ body.innerHTML='<div class="an-empty">Seçilen aralıkta dönem yok.</div>'; return; }
  var vis=m.series.filter(function(s){ return !AN.hidden.has(s.name); });
  var top=m.series.slice().sort(function(a,b){ return b.total-a.total; })[0];
  var avg=m.total/m.periods.length;
  body.innerHTML=
    '<div class="an-tiles">'+
      '<div class="tile"><div class="k">Gelen mail (konuşma)</div><div class="v">'+m.total.toLocaleString('tr-TR')+'</div><div class="s">'+esc(pLabel(AN.from,'day',true))+' – '+esc(pLabel(AN.to,'day',true))+'</div></div>'+
      '<div class="tile"><div class="k">Ortalama · '+grName(AN.gran)+'</div><div class="v">'+avg.toLocaleString('tr-TR',{maximumFractionDigits:1})+'</div><div class="s">'+m.periods.length+' dönem</div></div>'+
      '<div class="tile"><div class="k">En yoğun</div><div class="v" style="font-size:18px;margin-top:6px">'+(top&&top.total?esc(top.name):'—')+'</div><div class="s">'+(top&&top.total? top.total+' mail · %'+Math.round(top.total/m.total*100) : '')+'</div></div>'+
    '</div>'+
    '<div class="an-grid">'+
      '<div class="panel"><h3>Gelen mail trendi</h3><div class="ps">Client Manager kırılımı · '+grName(AN.gran)+'</div><div class="legend" id="anLegend"></div><div class="chart" id="anLine"></div></div>'+
      '<div class="panel"><h3>Toplam · Client Manager</h3><div class="ps">Seçilen aralıktaki toplam gelen mail · günlük ortalama ('+m.days+' gün)</div><div class="chart" id="anBar"></div></div>'+
    '</div>'+
    '<details class="an-table panel"><summary>Tablo görünümü</summary><div class="wrap" id="anTable"></div></details>'+
    '<div class="an-note">Sayım: Mail Board\'un takip ettiği her konuşma (thread), ilk mesajının geldiği tarihe göre bir kez sayılır; CM, konuşmaya atanan kişidir; bir CM\'e atanmamış konuşmalar sayılmaz. '+
      'Sheet\'e board kurulduktan sonra gelen tüm mailler ve geçmişteki okunmamış mailler aktarıldığı için, board öncesindeki okunmuş mailler eski dönemlerde eksik görünür'+
      (AN.data.since? ' (en eski kayıt: '+esc(pLabel(new Date(AN.data.since),'day',true))+')' : '')+'.</div>';
  anLegend(m);
  if (!vis.length) document.getElementById('anLine').innerHTML='<div class="an-empty">Gösterilecek seri yok — lejanttan en az birini aç.</div>';
  else anLine(document.getElementById('anLine'), m.periods, vis);
  anBar(document.getElementById('anBar'), m.series, m.total, m.days);
  anTable(document.getElementById('anTable'), m);
}
function anLegend(m){
  var el=document.getElementById('anLegend');
  m.series.forEach(function(s){
    var b=document.createElement('button'); b.className=AN.hidden.has(s.name)?'off':'';
    b.innerHTML='<span class="sw" style="background:'+s.color+'"></span>'+esc(s.name)+' <span class="sub">'+s.total+'</span>';
    b.title='Göster / gizle';
    b.onclick=function(){ AN.hidden.has(s.name)?AN.hidden.delete(s.name):AN.hidden.add(s.name); anRender(); };
    el.appendChild(b);
  });
}
function svgEl(tag, attrs, parent){ var e=document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceMax(v){ if (v<=4) return 4; var p=Math.pow(10, Math.floor(Math.log10(v))), n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function anLine(box, periods, series){
  box.innerHTML='';
  var W=Math.max(280, box.clientWidth), H=300, narrow=W<560;
  var L=34, R=narrow?12:118, T=10, B=26, pw=W-L-R, ph=H-T-B, n=periods.length;
  var max=niceMax(Math.max.apply(null, series.map(function(s){ return Math.max.apply(null, s.values); })));
  var x=function(i){ return n===1 ? L+pw/2 : L+i*pw/(n-1); }, y=function(v){ return T+ph-(v/max)*ph; };
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, height:H, role:'img', 'aria-label':'Client Manager kırılımında gelen mail trendi'}, box);
  // ızgara + y ekseni (sade)
  for (var k=0;k<=4;k++){
    var v=max*k/4, yy=y(v);
    svgEl('line',{x1:L,x2:L+pw,y1:yy,y2:yy,stroke:k===0?'var(--axis)':'var(--grid)','stroke-width':1},svg);
    var t=svgEl('text',{x:L-8,y:yy+4,'text-anchor':'end'},svg); t.textContent=(Math.round(v*10)/10).toLocaleString('tr-TR');
  }
  // x etiketleri (seyreltilmiş)
  var maxLab=Math.max(2, Math.floor(pw/64)), step=Math.ceil(n/maxLab);
  for (var i=0;i<n;i+=step){ var tx=svgEl('text',{x:x(i),y:H-8,'text-anchor':n===1?'middle':(i===0?'start':'middle')},svg); tx.textContent=pLabel(periods[i],AN.gran); }
  // çizgiler
  series.forEach(function(s){
    var d=s.values.map(function(v,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); }).join(' ');
    svgEl('path',{d:d,fill:'none',stroke:s.color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    // Veri noktaları (çok sık dönemde — ör. 1 yıl günlük — çizgi okunmaz hale gelmesin diye gösterilmez)
    var dotR = n<=1 ? 4 : (pw/(n-1) >= 14 ? 4 : pw/(n-1) >= 8 ? 3 : 0);
    if (dotR) s.values.forEach(function(v,i){ svgEl('circle',{cx:x(i).toFixed(1),cy:y(v).toFixed(1),r:dotR,fill:s.color,stroke:'var(--panel)','stroke-width':2},svg); });
  });
  // doğrudan etiketler (çizgi sonunda, çakışmasın diye aralıklı)
  if (!narrow && series.length<=6){
    var labs=series.map(function(s){ return { s:s, y:y(s.values[n-1]) }; }).sort(function(a,b){ return a.y-b.y; });
    for (var j=1;j<labs.length;j++) if (labs[j].y-labs[j-1].y<14) labs[j].y=labs[j-1].y+14;
    var over=labs.length? labs[labs.length-1].y-(T+ph+4) : 0; if (over>0) labs.forEach(function(l){ l.y-=over; });
    labs.forEach(function(l){
      svgEl('circle',{cx:x(n-1)+10,cy:l.y,r:3,fill:l.s.color},svg);
      var te=svgEl('text',{x:x(n-1)+17,y:l.y+4,'class':'lbl'},svg);
      var nm=l.s.name.split(' ')[0]; te.textContent=nm+' '+l.s.values[n-1];
    });
  }
  // hover katmanı: dikey çizgi + noktalar + ipucu
  var g=svgEl('g',{style:'display:none'},svg);
  var cross=svgEl('line',{y1:T,y2:T+ph,stroke:'var(--muted)','stroke-width':1,'stroke-dasharray':'3 3'},g);
  var dots=series.map(function(s){ return svgEl('circle',{r:4,fill:s.color,stroke:'var(--panel)','stroke-width':2},g); });
  var tt=document.createElement('div'); tt.className='tt'; box.appendChild(tt);
  var hit=svgEl('rect',{x:L-6,y:T,width:pw+12,height:ph,fill:'transparent'},svg);
  var show=function(ev){
    var r=svg.getBoundingClientRect(), mx=(ev.clientX-r.left)*(W/r.width);
    var i=n===1?0:Math.max(0,Math.min(n-1,Math.round((mx-L)/(pw/(n-1)))));
    g.style.display=''; cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i));
    series.forEach(function(s,k){ dots[k].setAttribute('cx',x(i)); dots[k].setAttribute('cy',y(s.values[i])); });
    var rows=series.map(function(s){ return {s:s,v:s.values[i]}; }).sort(function(a,b){ return b.v-a.v; });
    var sum=rows.reduce(function(a,b){ return a+b.v; },0);
    var ongoing = pNext(periods[i],AN.gran) > d0(new Date());
    tt.innerHTML='<div class="th">'+esc(pLabel(periods[i],AN.gran,true))+(ongoing?' <span class="sub">(devam ediyor)</span>':'')+'</div>'+
      rows.map(function(o){ return '<div class="tr"><span class="sw" style="background:'+o.s.color+'"></span>'+esc(o.s.name)+'<b>'+o.v+'</b></div>'; }).join('')+
      (rows.length>1?'<div class="tr tt-sum">Toplam<b>'+sum+'</b></div>':'');
    tt.style.display='block';
    var px=x(i)*(r.width/W), left=px+14; if (left+tt.offsetWidth>box.clientWidth) left=px-14-tt.offsetWidth;
    tt.style.left=Math.max(0,left)+'px'; tt.style.top='8px';
  };
  hit.addEventListener('mousemove',show);
  hit.addEventListener('mouseleave',function(){ g.style.display='none'; tt.style.display='none'; });
}

function anBar(box, series, total, days){
  box.innerHTML='';
  var rows=series.slice().sort(function(a,b){ return b.total-a.total; });
  if (!total){ box.innerHTML='<div class="an-empty">Bu aralıkta mail yok.</div>'; return; }
  var W=Math.max(260, box.clientWidth), LW=Math.min(120, W*0.34), VW=96, bh=20, gap=12, T=4;
  var H=T+rows.length*(bh+gap), pw=W-LW-VW, max=Math.max.apply(null, rows.map(function(r){ return r.total; }));
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,height:H,role:'img','aria-label':'Client Manager bazında toplam gelen mail'},box);
  var tt=document.createElement('div'); tt.className='tt'; box.appendChild(tt);
  rows.forEach(function(s,i){
    var yy=T+i*(bh+gap), w=max? Math.max(s.total?4:0, s.total/max*pw) : 0;
    var nm=svgEl('text',{x:0,y:yy+bh/2+4,'class':'lbl'},svg); nm.textContent=s.name.length>16? s.name.slice(0,15)+'…' : s.name;
    svgEl('rect',{x:LW,y:yy,width:pw,height:bh,fill:'var(--grid)',rx:4},svg);
    if (w){ var x0=LW, r=Math.min(4,w/2);
      svgEl('path',{d:'M'+x0+' '+yy+'H'+(x0+w-r)+'Q'+(x0+w)+' '+yy+' '+(x0+w)+' '+(yy+r)+'V'+(yy+bh-r)+'Q'+(x0+w)+' '+(yy+bh)+' '+(x0+w-r)+' '+(yy+bh)+'H'+x0+'Z',fill:s.color},svg); }
    var avgD=(s.total/days).toLocaleString('tr-TR',{maximumFractionDigits:1});
    var vt=svgEl('text',{x:LW+w+6,y:yy+bh/2+4,'class':'lbl'},svg); vt.textContent=s.total;
    var va=svgEl('tspan',{dx:6,'font-weight':400,fill:'var(--muted)'},vt); va.textContent=avgD+'/gün';
    var hit=svgEl('rect',{x:0,y:yy-gap/2,width:W,height:bh+gap,fill:'transparent'},svg);
    hit.addEventListener('mousemove',function(ev){
      var rb=box.getBoundingClientRect();
      tt.innerHTML='<div class="tr"><span class="sw" style="background:'+s.color+'"></span><b style="margin-left:0;padding-left:0">'+esc(s.name)+'</b></div><div class="tr">Gelen mail<b>'+s.total+'</b></div><div class="tr">Günlük ortalama<b>'+avgD+'</b></div><div class="tr">Pay<b>%'+(Math.round(s.total/total*1000)/10).toLocaleString('tr-TR')+'</b></div>';
      tt.style.display='block';
      var left=ev.clientX-rb.left+12; if (left+tt.offsetWidth>box.clientWidth) left=ev.clientX-rb.left-12-tt.offsetWidth;
      tt.style.left=Math.max(0,left)+'px'; tt.style.top=(yy+bh+4)*(rb.width/W)+'px';
    });
    hit.addEventListener('mouseleave',function(){ tt.style.display='none'; });
  });
}

function anTable(box, m){
  var h='<table><thead><tr><th>Dönem</th>'+m.series.map(function(s){ return '<th>'+esc(s.name)+'</th>'; }).join('')+'<th>Toplam</th></tr></thead><tbody>';
  for (var i=m.periods.length-1;i>=0;i--){
    var sum=0; h+='<tr><td>'+esc(pLabel(m.periods[i],AN.gran,true))+'</td>'+m.series.map(function(s){ sum+=s.values[i]; return '<td>'+s.values[i]+'</td>'; }).join('')+'<td><b>'+sum+'</b></td></tr>';
  }
  h+='</tbody><tfoot><tr><th>Toplam</th>'+m.series.map(function(s){ return '<th>'+s.total+'</th>'; }).join('')+'<th>'+m.total+'</th></tr></tfoot></table>';
  box.innerHTML=h;
}

if (DEMO) document.getElementById('demoBar').style.display='block';
// ---------- Hafif mail görüntüleyici (?thread=<id>): sadece konuşma, Gmail yüklenmez ----------
function openViewer(tid, me){
  document.body.classList.add('viewer');
  var v=document.createElement('div'); v.id='viewer';
  var glink='https://mail.google.com/mail/?authuser='+encodeURIComponent(me||'')+'#all/'+encodeURIComponent(tid);
  v.innerHTML='<div class="vw-top"><h2 id="vwSubj">Yükleniyor…</h2><a class="btn sm" href="'+esc(glink)+'" target="_blank" rel="noopener">Gmail\'de aç ↗</a></div><div class="msgs" id="vwMsgs">'+
    [0,1].map(function(){ return '<div class="msk"><div class="sk" style="height:10px;width:35%"></div><div class="sk" style="height:10px;width:92%"></div><div class="sk" style="height:10px;width:70%"></div></div>'; }).join('')+'</div>';
  document.body.appendChild(v);
  api('getThreadDetail', tid).then(function(d){
    var ms=d.messages||[]; var subj=(d.subject||(ms[0]&&ms[0].subject)||'');
    document.getElementById('vwSubj').textContent=subj||'Konuşma'; document.title=subj||'Mail';
    renderThread(document.getElementById('vwMsgs'), ms);
  }).catch(function(e){ document.getElementById('vwMsgs').innerHTML='<div class="empty">Açılamadı: '+esc(e.message||e)+'</div>'; });
}
if (!DEMO && google.script.url) google.script.url.getLocation(function(loc){ var p=(loc&&loc.parameter)||{}; if (p.thread) openViewer(p.thread, p.u); else load(); });
else load();
